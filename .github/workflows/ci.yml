# CI (test plan, section 9, rule 1): lint, L1, and L2 tests on each push.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint, L1 tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: system/frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: system/frontend/package-lock.json
      - run: npm ci
      - run: npx ng lint
      - run: npx ng test --watch=false --coverage
      - run: npx ng build

  backend:
    name: Backend L2 tests against dev
    runs-on: ubuntu-latest
    # Only one L2 run at a time. The tests share the dev project.
    concurrency:
      group: backend-l2-dev
    defaults:
      run:
        working-directory: system/backend
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL_DEV }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_DEV }}
      SEED_PASSWORD: ${{ secrets.SEED_PASSWORD_DEV }}
      KEEPALIVE_SECRET: ${{ secrets.KEEPALIVE_SECRET_DEV }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # GitHub does not give the secrets to a pull request from a fork. Thus the L2 tests cannot run for it.
      # Do not use pull_request_target to get the secrets: the code of the fork could then read them.
      # A fork pull request that does not change the backend skips the L2 tests (for example, a UI change).
      # A fork pull request that changes the backend fails. A maintainer must run it from a branch of this repository.
      - id: scope
        name: Examine the source of the change
        working-directory: .
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            if git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | grep -q '^system/backend/'; then
              echo "::error::This pull request comes from a fork and changes system/backend/. The L2 tests need the dev secrets, which forks do not get. A maintainer must push the change to a branch of this repository."
              exit 1
            fi
            echo "::notice::Pull request from a fork with no backend change: the L2 tests are skipped (forks do not get the dev secrets)."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: system/backend/package-lock.json
      - if: steps.scope.outputs.run == 'true'
        run: npm ci
      - if: steps.scope.outputs.run == 'true'
        run: npx vitest run
